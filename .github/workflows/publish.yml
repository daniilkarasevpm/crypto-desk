# The "robot": collects fresh data and publishes the site.
# Runs every 15 minutes, whenever something is pushed to main,
# and when started by hand from the Actions tab ("Run workflow").
name: Publish site

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes (GitHub may start it a few minutes late)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Fetch market stats, the economic calendar and news into data/
      - name: Collect data
        run: python3 scripts/collect.py
        env:
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}

      # Put the page and the data files together in one folder for publishing
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          cp -r data _site/data

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
