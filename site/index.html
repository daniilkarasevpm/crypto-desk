<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Crypto Desk</title>
  <meta name="description" content="BTC, ETH and SOL at a glance: prices, Fed and inflation calendar, market stats and today's analyst view.">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Top bar: name of the site and when data was last refreshed -->
  <header class="topbar">
    <h1>Crypto Desk</h1>
    <p class="meta"><span id="sample-badge" class="badge" hidden>Sample data</span> USD · <span id="updated">loading…</span></p>
  </header>

  <main class="grid">
    <!-- 1. Market statistics: four tiles in a row (2x2 on phones) -->
    <section class="stats" aria-label="Market statistics">
      <div class="tile"><p class="label">Total market cap</p><p class="value" id="stat-mcap">–</p><p class="change" id="stat-mcap-change"></p></div>
      <div class="tile"><p class="label">24h volume</p><p class="value" id="stat-volume">–</p></div>
      <div class="tile"><p class="label">BTC dominance</p><p class="value" id="stat-dominance">–</p></div>
      <div class="tile"><p class="label">Fear &amp; Greed</p><p class="value" id="stat-fng">–</p><p class="change" id="stat-fng-label"></p></div>
    </section>

    <!-- 2. Price charts: one card per coin, filled in by script.js -->
    <section class="charts" aria-label="Price charts" id="charts"></section>

    <!-- 3. Upcoming events, grouped by day -->
    <section class="card events" aria-labelledby="events-title">
      <h2 id="events-title">Upcoming events</h2>
      <div id="events-list"><p class="muted">Loading…</p></div>
    </section>

    <!-- 4. Analysts' view for today -->
    <section class="card analysts" aria-labelledby="analysts-title">
      <h2 id="analysts-title">Analysts today</h2>
      <div id="analysts-body"><p class="muted">Loading…</p></div>
      <p class="disclaimer">Summary of public opinions. Not financial advice.</p>
    </section>

    <!-- 5. Latest headlines -->
    <section class="card news" aria-labelledby="news-title">
      <h2 id="news-title">Latest news (24h)</h2>
      <ul id="news-list" class="news-list"><li class="muted">Loading…</li></ul>
    </section>
  </main>

  <!-- Free, open-source chart library by TradingView -->
  <script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
  <script src="script.js"></script>
</body>
</html>
